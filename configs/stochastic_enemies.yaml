# Version 04: moving goal + independent stochastic enemies.
seed: 42
training:
  episodes: 1000
  evaluation_episodes: 200
  max_steps: 500
  log_interval: 20
  checkpoint_interval: 0

environment:
  goal_move_interval: 3
  enemy_speed_intervals: [1, 2, 3, 4, 5]
  pause_probability: 0.20
  pause_duration: [1, 4]
  spawn_min_distance: 4

# Deliberately unchanged from versions 02/03.
dqn:
  learning_rate: 0.0001
  gamma: 0.99
  replay_capacity: 100000
  batch_size: 128
  learning_starts: 3000
  train_frequency: 4
  target_update_interval: 2000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 300000
  hidden_dim: 256

output_dir: results_stochastic_enemies
